name: flatsync
description: Offline-first peer-to-peer expense sharing app for local WiFi networks.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Database
  isar: ^3.1.0
  isar_flutter_libs:

  # State Management
  provider: ^6.0.0

  # Networking & Sync
  connectivity_plus: ^5.0.0
  network_info_plus: ^4.0.0
  http: ^1.1.0
  uuid: ^4.0.0

  # Local Network Discovery
  multicast_dns: ^0.3.0

  # UI & Theme
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0
  device_info_plus: ^9.0.0
  csv: ^5.1.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.0.0
  share_plus: ^7.0.0
  shared_preferences: ^2.0.0
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  # see https://flutter.dev/to/font-from-package
